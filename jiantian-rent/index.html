<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>建田车辆收租</title>
<style>
  :root{--ink:#1b2330;--sub:#767b85;--faint:#a3a7ae;--bg:#f3f3f0;--sheet:#fff;--line:#ecece9;--line2:#e2e2de;--od:#a83a30;--odbg:#f6e9e7;--due:#8a6210;--duebg:#f4edda;--ok:#2c6a49;--okbg:#e6efe9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button,input{font-family:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:96px;position:relative}
  .mast{background:var(--ink);color:#fff;padding:18px 20px 20px}
  .mast .line{display:flex;align-items:center;justify-content:space-between}
  .mast .name{font-size:13px;letter-spacing:3px;color:#aeb4bd;font-weight:500}
  .mast .date{font-size:12.5px;color:#9298a1;margin-top:3px;letter-spacing:.5px}
  .mast .refresh{background:none;border:1px solid #3a424e;color:#c3c8cf;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer;letter-spacing:1px}
  .stat{margin-top:16px;display:flex;align-items:baseline;gap:12px}
  .stat .n{font-size:44px;font-weight:800;line-height:.9;letter-spacing:-1px}
  .stat .u{font-size:14px;color:#aeb4bd;letter-spacing:1px}
  .brk{margin-top:12px;font-size:12.5px;color:#9aa0a9;letter-spacing:.5px}
  .brk .od{color:#e79a92}.brk .sep{color:#4a515c;margin:0 8px}
  .tabs{display:flex;gap:26px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:9}
  .tab{background:none;border:none;padding:14px 0 11px;font-size:15px;color:var(--sub);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:1px}
  .tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  .search{padding:12px 20px 4px}
  .search input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:10px 13px;font-size:15px;outline:none;color:var(--ink)}
  .search input::placeholder{color:var(--faint)}
  .list{margin:10px 16px;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .item{padding:14px 16px;border-top:1px solid var(--line)}.item:first-child{border-top:none}
  .ihead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .plate{font-size:16.5px;font-weight:700;letter-spacing:.3px}.who{font-size:13px;color:var(--sub);margin-top:3px}
  .right{text-align:right;flex-shrink:0}.amt{font-size:16px;font-weight:700}.amt .yen{font-size:12px;color:var(--faint);font-weight:500;margin-right:1px}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;margin-top:6px;letter-spacing:.5px}
  .pill.od{color:var(--od);background:var(--odbg)}.pill.due{color:var(--due);background:var(--duebg)}
  .pill.ok{color:var(--ok);background:var(--okbg)}.pill.norm{color:var(--sub);background:#efefec}
  .acts{display:flex;gap:8px;margin-top:12px}
  .b{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:14.5px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:block}
  .b.call{border-color:var(--ink)}.b.call.off{color:var(--faint);border-color:var(--line2);pointer-events:none}
  .b.paid{background:var(--ok);border-color:var(--ok);color:#fff}
  .b.undo{background:#fff;color:var(--sub);flex:0 0 76px}.b.edit{flex:0 0 58px;color:var(--sub)}
  .empty{padding:56px 24px;text-align:center;color:var(--sub);font-size:15px;line-height:1.9}
  .foot{text-align:center;color:var(--faint);font-size:12px;padding:16px 24px 4px;line-height:1.8}
  .fab{position:absolute;right:16px;bottom:20px;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:600;letter-spacing:1px;box-shadow:0 4px 14px rgba(27,35,48,.28);cursor:pointer;z-index:30}
  .mask{position:fixed;inset:0;background:rgba(20,26,36,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 20px 28px;max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 16px;font-size:17px;font-weight:700}
  .field{margin-bottom:13px}.field label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:6px;letter-spacing:.5px}
  .field input{width:100%;border:1px solid var(--line2);border-radius:8px;padding:11px 12px;font-size:16px;outline:none;color:var(--ink)}
  .field input:focus{border-color:var(--ink)}
  .srow{display:flex;gap:10px;margin-top:4px}.srow .b{padding:12px}
  .b.save{background:var(--ink);border-color:var(--ink);color:#fff}.b.cancel{color:var(--sub)}
  .del{margin-top:12px;width:100%;padding:11px;border:1px solid var(--odbg);background:var(--odbg);color:var(--od);border-radius:8px;font-weight:600;font-size:14.5px;cursor:pointer}
  .setup{padding:34px 24px}.setup .box{max-width:420px;margin:0 auto}.setup h2{font-size:19px;font-weight:700;margin:0 0 8px}
  .setup p{font-size:14px;color:var(--sub);line-height:1.8;margin:0 0 18px}.setup .err{color:var(--od);font-size:13px;margin:0 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="line">
      <div><div class="name">建田车辆收租</div><div class="date" id="today"></div></div>
      <button class="refresh" onclick="load()">刷新</button>
    </div>
    <div class="stat"><span class="n" id="cui">-</span><span class="u">部　今日要催</span></div>
    <div class="brk" id="sub">载入中</div>
  </div>
  <div id="app" style="display:none">
    <div class="tabs">
      <button class="tab on" data-tab="cui">要催</button>
      <button class="tab" data-tab="all">全部</button>
      <button class="tab" data-tab="ok">本月已收</button>
    </div>
    <div class="search"><input id="q" placeholder="搜车牌或租户"></div>
    <div class="list" id="list"></div>
    <div class="foot">每次收款可录金额，分几次交会自动累计，欠款唔会月初自动消失。</div>
    <button class="fab" onclick="openForm()">+ 加车</button>
  </div>
  <div id="setup" class="setup" style="display:none"></div>
</div>
<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="formTitle">加车</h3>
    <div class="field"><label>车牌</label><input id="f_plate"></div>
    <div class="field"><label>租户</label><input id="f_tenant"></div>
    <div class="field"><label>电话</label><input id="f_phone" inputmode="numeric"></div>
    <div class="field"><label>月租金</label><input id="f_rent" inputmode="numeric"></div>
    <div class="field"><label>交租日（每月几号，1-31）</label><input id="f_day" inputmode="numeric"></div>
    <div class="field"><label>备注</label><input id="f_note"></div>
    <div class="srow"><button class="b cancel" onclick="closeForm()">取消</button><button class="b save" onclick="submitForm()">保存</button></div>
    <button class="del" id="delBtn" style="display:none" onclick="removeCar()">删除呢部车</button>
  </div>
</div>
<div class="mask" id="payMask">
  <div class="sheet">
    <h3 id="payTitle">收款</h3>
    <div class="field"><label>收款月份</label><input id="p_month" disabled></div>
    <div class="field"><label>本月应收 / 已收 / 尚欠</label><input id="p_summary" disabled></div>
    <div class="field"><label>本次收款金额</label><input id="p_amount" inputmode="numeric"></div>
    <div class="field"><label>收款日期</label><input id="p_date" type="date"></div>
    <div class="field"><label>备注</label><input id="p_note" placeholder="现金 / 微信 / 补租"></div>
    <div class="srow"><button class="b cancel" onclick="closePay()">取消</button><button class="b save" onclick="submitPay()">保存收款</button></div>
  </div>
</div>
<script>
const TELEGRAPH_PATH="jt-rent-data-07-07";
const TELEGRAPH_TOKEN="a8311f6f8da7a98be73a5581275cdd99eee7c36803531e3942d18dd66d6d";
const TELEGRAPH_TITLE="jt-rent-data";
const TELEGRAPH_AUTHOR="Jiantian";
const TRACK_START_MONTH="2026-07";
const today=new Date();today.setHours(0,0,0,0);
let DATA={version:2,track_start:TRACK_START_MONTH,cars:[],payments:{}},CARS=[],tab="cui",q="",editing=null,paying=null;

const dataUrl=()=>`https://api.telegra.ph/getPage/${TELEGRAPH_PATH}?return_content=true&_=${Date.now()}`;
const DIM=(y,m)=>new Date(y,m+1,0).getDate();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const money=n=>(n||0).toLocaleString();
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const thisMonth=()=>ym(today);
function parseYM(m){const a=m.split("-").map(Number);return new Date(a[0],a[1]-1,1);}
function nextYM(m){const d=parseYM(m);d.setMonth(d.getMonth()+1);return ym(d);}
function cmpYM(a,b){return a===b?0:(a<b?-1:1);}
function monthLabel(m){const a=m.split("-");return Number(a[0])+"年"+Number(a[1])+"月";}
function paymentKey(id,m){return id+":"+m;}
function pageContent(data){return JSON.stringify([{tag:"pre",children:[JSON.stringify(data)]}]);}

function normalizeData(data){
  if(!data)return {version:2,track_start:TRACK_START_MONTH,cars:[],payments:{}};
  if(Array.isArray(data)){
    const payments={};
    const cars=data.map(c=>{
      const car={...c,active_from:c.active_from||TRACK_START_MONTH};
      if(car.last_paid)payments[paymentKey(car.id,String(car.last_paid).slice(0,7))]={paid_at:car.last_paid};
      delete car.last_paid;
      return car;
    });
    return {version:2,track_start:TRACK_START_MONTH,cars,payments};
  }
  const start=data.track_start||TRACK_START_MONTH;
  const cars=(data.cars||[]).map(c=>({...c,active_from:c.active_from||start}));
  return {version:2,track_start:start,cars,payments:data.payments||{}};
}
async function fetchData(){
  const r=await fetch(dataUrl(),{cache:"no-store"});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"读取失败");
  const node=(j.result.content||[]).find(n=>n.tag==="pre");
  const raw=node&&node.children?node.children.join(""):"[]";
  return normalizeData(JSON.parse(raw));
}
async function saveData(data){
  data=normalizeData(data);
  const p=new URLSearchParams();
  p.set("access_token",TELEGRAPH_TOKEN);
  p.set("title",TELEGRAPH_TITLE);
  p.set("author_name",TELEGRAPH_AUTHOR);
  p.set("content",pageContent(data));
  p.set("return_content","false");
  const r=await fetch(`https://api.telegra.ph/editPage/${TELEGRAPH_PATH}`,{method:"POST",body:p});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"保存失败");
  DATA=data;CARS=data.cars;
}
async function updateData(fn){
  const latest=await fetchData();
  await fn(latest);
  await saveData(latest);
  render();
}
async function load(){
  try{
    document.getElementById("sub").textContent="载入中";
    DATA=await fetchData();CARS=DATA.cars;
    document.getElementById("setup").style.display="none";
    document.getElementById("app").style.display="block";
    render();
  }catch(e){showSetup("连接云端数据失败，请稍后再试。<br>"+String(e).slice(0,120));}
}
function showSetup(err){
  document.getElementById("app").style.display="none";
  document.getElementById("cui").textContent="-";
  document.getElementById("sub").textContent="未连接";
  const s=document.getElementById("setup");s.style.display="block";
  s.innerHTML='<div class="box"><h2>云端连接失败</h2><p>数据已设置为多人共享在线同步。请确认手机有网络，然后再刷新。</p>'+(err?'<p class="err">'+err+"</p>":"")+'<button class="b save" style="width:100%;margin-top:6px" onclick="load()">重新连接</button></div>';
}
function getPayments(data,c,m){
  const v=(data.payments||{})[paymentKey(c.id,m)];
  if(Array.isArray(v))return v;
  if(v&&typeof v==="object")return [{amount:c.rent||0,date:v.paid_at||v.date||iso(today),note:v.note||""}];
  return [];
}
function paidAmount(data,c,m){return getPayments(data,c,m).reduce((a,p)=>a+(parseInt(p.amount)||0),0);}
function monthRent(c){return parseInt(c.rent)||0;}
function monthOwe(data,c,m){return Math.max(monthRent(c)-paidAmount(data,c,m),0);}
function isPaid(c,m){return monthRent(c)>0&&monthOwe(DATA,c,m)<=0;}
function hasPaidThisMonth(c){return paidAmount(DATA,c,thisMonth())>0;}
function monthDueDate(c,m){const d=parseYM(m);return new Date(d.getFullYear(),d.getMonth(),Math.min(c.due_day,DIM(d.getFullYear(),d.getMonth())));}
function dueDate(day){return monthDueDate({due_day:day},thisMonth());}
function collectableMonths(c,includeTomorrow=true){
  if(!c.due_day)return[];
  const limit=new Date(today);if(includeTomorrow)limit.setDate(limit.getDate()+1);
  const out=[];let m=c.active_from||DATA.track_start||TRACK_START_MONTH;
  while(cmpYM(m,thisMonth())<=0){
    const due=monthDueDate(c,m);
    const paid=paidAmount(DATA,c,m),owe=monthOwe(DATA,c,m);
    if(due<=limit&&owe>0)out.push({month:m,due,paid,owe,diff:Math.round((due-today)/86400000)});
    m=nextYM(m);
  }
  return out;
}
function paidThisMonth(c){return isPaid(c,thisMonth());}
function status(c){
  if(!c.due_day)return{key:"norm",cls:"norm",label:"-",diff:9999,unpaid:[]};
  const unpaid=collectableMonths(c,true);
  if(unpaid.length){
    const first=unpaid[0],over=unpaid.filter(x=>x.diff<0);
    if(first.paid>0&&unpaid.length===1)return{key:over.length?"od":"due",cls:over.length?"od":"due",label:"欠¥"+money(first.owe),diff:first.diff,unpaid};
    if(over.length)return{key:"od",cls:"od",label:unpaid.length>1?"欠"+unpaid.length+"期":"逾期"+(-first.diff)+"天",diff:first.diff,unpaid};
    if(first.diff===0)return{key:"due",cls:"due",label:"今日到期",diff:first.diff,unpaid};
    if(first.diff===1)return{key:"due",cls:"due",label:"明日到期",diff:first.diff,unpaid};
  }
  const due=dueDate(c.due_day),diff=Math.round((due-today)/86400000);
  if(paidThisMonth(c))return{key:"ok",cls:"ok",label:"本月收齐",diff,unpaid:[]};
  if(diff<0)return{key:"norm",cls:"norm",label:"下月待收",diff:9999,unpaid:[]};
  return{key:"norm",cls:"norm",label:(due.getMonth()+1)+"月"+due.getDate()+"日到期",diff,unpaid:[]};
}
const needCui=s=>s.key==="od"||s.key==="due";
document.getElementById("today").textContent=today.getFullYear()+"年"+(today.getMonth()+1)+"月"+today.getDate()+"日";

function render(){
  if(CARS.length===0){
    document.getElementById("cui").textContent="0";
    document.getElementById("sub").textContent="云端仲未有车";
    document.getElementById("list").innerHTML='<div class="empty">云端数据库仲未有车辆资料。</div>';
    return;
  }
  let rows=CARS.map(c=>({c,s:status(c)}));
  const cuiRows=rows.filter(r=>needCui(r.s));
  const odN=cuiRows.filter(r=>r.s.key==="od").length;
  const qi=cuiRows.reduce((a,r)=>a+(r.s.unpaid&&r.s.unpaid.length?r.s.unpaid.length:1),0);
  const amt=cuiRows.reduce((a,r)=>a+(r.s.unpaid||[]).reduce((x,m)=>x+m.owe,0),0);
  document.getElementById("cui").textContent=cuiRows.length;
  document.getElementById("sub").innerHTML='逾期 <span class="od">'+odN+'</span> 部<span class="sep">·</span>欠租 '+qi+' 期<span class="sep">·</span>应催 ¥'+money(amt)+'<span class="sep">·</span>共 '+CARS.length+" 部车";
  if(tab==="cui")rows=cuiRows;else if(tab==="ok")rows=rows.filter(r=>hasPaidThisMonth(r.c));
  if(q){const k=q.trim();rows=rows.filter(r=>(r.c.plate||"").includes(k)||(r.c.tenant||"").includes(k));}
  if(tab==="cui")rows.sort((a,b)=>a.s.diff-b.s.diff);else rows.sort((a,b)=>(a.c.due_day||99)-(b.c.due_day||99));
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML='<div class="empty">'+(tab==="cui"?"今日冇车要催":tab==="ok"?"本月仲未有已收记录":"揾唔到相符嘅车")+"</div>";return;}
  const showActs=tab!=="all";
  list.innerHTML=rows.map(({c,s})=>{
    const phone=(c.phone||"").trim();
    const amtHtml=c.rent?'<span class="yen">¥</span>'+money(c.rent):"-";
    const owe=s.unpaid&&s.unpaid.length?"　欠租 "+s.unpaid.map(x=>monthLabel(x.month)+(x.paid?" 已收¥"+money(x.paid)+" 欠¥"+money(x.owe):" 欠¥"+money(x.owe))).join("、"):"";
    const who="租户 "+(c.tenant||"-")+"　交租日 "+(c.due_day||"-")+"号"+owe+(c.note?"　"+c.note:"");
    let acts="";
    if(showActs){
      const call=phone?'<a class="b call" href="tel:'+phone+'">致电</a>':'<span class="b call off">无电话</span>';
      const main=tab==="ok"?'<button class="b undo" onclick="undo('+c.id+')">撤销</button>':'<button class="b paid" onclick="openPay('+c.id+')">收款</button>';
      acts='<div class="acts">'+call+'<button class="b edit" onclick="openForm('+c.id+')">改</button>'+main+"</div>";
    }
    const rc=showActs?"":' onclick="openForm('+c.id+')" style="cursor:pointer"';
    return '<div class="item"'+rc+'><div class="ihead"><div><div class="plate">'+(c.plate||"-")+'</div><div class="who">'+who+'</div></div><div class="right"><div class="amt">'+amtHtml+'</div><span class="pill '+s.cls+'">'+s.label+"</span></div></div>"+acts+"</div>";
  }).join("");
}
function openPay(id){
  const c=CARS.find(x=>x.id===id),m=c&&collectableMonths(c,true)[0];
  if(!c||!m){alert("呢部车暂时冇到期欠款。");return;}
  paying={id,month:m.month};
  document.getElementById("payTitle").textContent="收款 - "+(c.plate||"");
  document.getElementById("p_month").value=monthLabel(m.month);
  document.getElementById("p_summary").value="应收 ¥"+money(monthRent(c))+" / 已收 ¥"+money(m.paid)+" / 尚欠 ¥"+money(m.owe);
  document.getElementById("p_amount").value=m.owe||"";
  document.getElementById("p_date").value=iso(today);
  document.getElementById("p_note").value="";
  document.getElementById("payMask").classList.add("on");
}
function closePay(){document.getElementById("payMask").classList.remove("on");paying=null;}
async function submitPay(){
  if(!paying)return;
  const amount=parseInt(document.getElementById("p_amount").value.trim());
  const date=document.getElementById("p_date").value||iso(today);
  const note=document.getElementById("p_note").value.trim();
  if(!amount||amount<=0){alert("请输入收款金额。");return;}
  try{
    await updateData(data=>{
      const c=data.cars.find(x=>x.id===paying.id);if(!c)return;
      const key=paymentKey(paying.id,paying.month);
      const list=getPayments(data,c,paying.month);
      list.push({amount,date,note});
      data.payments[key]=list;
    });
    closePay();await load();
  }catch(e){alert("保存失败："+e);}
}
async function undo(id){
  try{await updateData(data=>{
    const c=data.cars.find(x=>x.id===id);if(!c)return;
    const key=paymentKey(id,thisMonth()),v=data.payments[key];
    if(Array.isArray(v)){v.pop();if(!v.length)delete data.payments[key];}
    else if(v)delete data.payments[key];
  });}
  catch(e){alert("失败："+e);}
}
function openForm(id){
  editing=id||null;const t=document.getElementById("formTitle"),del=document.getElementById("delBtn");const g=k=>document.getElementById("f_"+k);
  if(editing){const c=CARS.find(x=>x.id===editing);t.textContent="改资料";del.style.display="block";g("plate").value=c.plate||"";g("tenant").value=c.tenant||"";g("phone").value=c.phone||"";g("rent").value=c.rent||"";g("day").value=c.due_day||"";g("note").value=c.note||"";}
  else{t.textContent="加车";del.style.display="none";["plate","tenant","phone","rent","day","note"].forEach(k=>g(k).value="");}
  document.getElementById("mask").classList.add("on");
}
function closeForm(){document.getElementById("mask").classList.remove("on");}
async function submitForm(){
  const g=k=>document.getElementById("f_"+k).value.trim();
  const body={plate:g("plate")||null,tenant:g("tenant")||null,phone:g("phone")||null,rent:g("rent")?parseInt(g("rent")):null,due_day:g("day")?parseInt(g("day")):null,note:g("note")||null};
  try{
    await updateData(data=>{
      const cars=data.cars;
      if(editing){const i=cars.findIndex(x=>x.id===editing);if(i>=0)cars[i]={...cars[i],...body};}
      else{const id=cars.reduce((m,c)=>Math.max(m,c.id||0),0)+1;cars.push({id,active_from:thisMonth(),...body});}
    });
    closeForm();await load();
  }catch(e){alert("保存失败："+e);}
}
async function removeCar(){
  if(!editing)return;if(!confirm("确定删除呢部车？"))return;
  try{await updateData(data=>{const i=data.cars.findIndex(x=>x.id===editing);if(i>=0)data.cars.splice(i,1);Object.keys(data.payments).forEach(k=>{if(k.startsWith(editing+":"))delete data.payments[k];});});closeForm();await load();}
  catch(e){alert("删除失败："+e);}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render();});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render();});
document.getElementById("mask").addEventListener("click",e=>{if(e.target.id==="mask")closeForm();});
document.getElementById("payMask").addEventListener("click",e=>{if(e.target.id==="payMask")closePay();});
window.addEventListener("focus",load);
load();
</script>
</body>
