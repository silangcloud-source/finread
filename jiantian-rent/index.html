const today=new Date();today.setHours(0,0,0,0);
let CARS=[],tab='cui',q='',editing=null;
const dataUrl=()=>`https://api.telegra.ph/getPage/${TELEGRAPH_PATH}?return_content=true&_=${Date.now()}`;
function pageContent(cars){return JSON.stringify([{tag:'pre',children:[JSON.stringify(cars)]}]);}
async function fetchCars(){
  const r=await fetch(dataUrl(),{cache:'no-store'});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'读取失败');
  const node=(j.result.content||[]).find(n=>n.tag==='pre');
  const raw=node&&node.children?node.children.join(''):'[]';
  const data=JSON.parse(raw);
  return Array.isArray(data)?data:(data.cars||[]);
}
async function saveCars(cars){
  const p=new URLSearchParams();
  p.set('access_token',TELEGRAPH_TOKEN);
  p.set('title',TELEGRAPH_TITLE);
  p.set('author_name',TELEGRAPH_AUTHOR);
  p.set('content',pageContent(cars));
  p.set('return_content','false');
  const r=await fetch(`https://api.telegra.ph/editPage/${TELEGRAPH_PATH}`,{method:'POST',body:p});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'保存失败');
  CARS=cars;
}
async function updateCars(fn){
  const latest=await fetchCars();
  await fn(latest);
  await saveCars(latest);
  render();
}
async function load(){
  try{document.getElementById('sub').textContent='载入中';
    CARS=await fetchCars();
    document.getElementById('setup').style.display='none';
    document.getElementById('app').style.display='block';render();
  }catch(e){showSetup('连接云端数据失败，请稍后再试。<br>'+String(e).slice(0,120));}
}
function showSetup(err){
  document.getElementById('app').style.display='none';
  document.getElementById('cui').textContent='–';document.getElementById('sub').textContent='未连接';
  const s=document.getElementById('setup');s.style.display='block';
  s.innerHTML='<div class="box"><h2>云端连接失败</h2>'
    +'<p>数据已设置为多人共享在线同步。请确认手机有网络，然后再刷新。</p>'
    +(err?'<p class="err">'+err+'</p>':'')
    +'<button class="b save" style="width:100%;margin-top:6px" onclick="load()">重新连接</button></div>';
}
const DIM=(y,m)=>new Date(y,m+1,0).getDate();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
function dueDate(day){const y=today.getFullYear(),m=today.getMonth();return new Date(y,m,Math.min(day,DIM(y,m)));}
function paidThisMonth(c){if(!c.last_paid)return false;const d=new Date(c.last_paid+'T00:00:00');return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth();}
function status(c){
  if(!c.due_day)return{key:'norm',cls:'norm',label:'—',diff:9999};
  const due=dueDate(c.due_day),diff=Math.round((due-today)/86400000);
  if(paidThisMonth(c))return{key:'ok',cls:'ok',label:'已收',diff};
  if(diff<0)return{key:'od',cls:'od',label:'逾期'+(-diff)+'天',diff};
  if(diff===0)return{key:'due',cls:'due',label:'今日到期',diff};
  if(diff===1)return{key:'due',cls:'due',label:'明日到期',diff};
  return{key:'norm',cls:'norm',label:fmt(due)+'到期',diff};
}
const needCui=s=>s.key==='od'||s.key==='due';
document.getElementById('today').textContent=today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';

function render(){
  if(CARS.length===0){
    document.getElementById('cui').textContent='0';
    document.getElementById('sub').textContent='云端仲未有车';
    document.getElementById('list').innerHTML=
      '<div class="empty">云端数据库仲係空嘅。<br><br>'
      +'<button class="b save" style="max-width:220px;margin:0 auto" onclick="importSeed(this)">导入 138 部车</button>'
      +'<br><span style="font-size:12.5px;color:var(--faint)">只需撳一次，之后自动同步</span></div>';
    return;
  }
  let rows=CARS.map(c=>({c,s:status(c)}));
  const cuiRows=rows.filter(r=>needCui(r.s));
  const odN=cuiRows.filter(r=>r.s.key==='od').length;
  const amt=cuiRows.reduce((a,r)=>a+(r.c.rent||0),0);
  document.getElementById('cui').textContent=cuiRows.length;
  document.getElementById('sub').innerHTML='逾期 <span class="od">'+odN+'</span> 部<span class="sep">·</span>应催 ¥'+amt.toLocaleString()+'<span class="sep">·</span>共 '+CARS.length+' 部车';
  if(tab==='cui')rows=cuiRows;else if(tab==='ok')rows=rows.filter(r=>r.s.key==='ok');
  if(q){const k=q.trim();rows=rows.filter(r=>(r.c.plate||'').includes(k)||(r.c.tenant||'').includes(k));}
  if(tab==='cui')rows.sort((a,b)=>a.s.diff-b.s.diff);else rows.sort((a,b)=>(a.c.due_day||99)-(b.c.due_day||99));
  const list=document.getElementById('list');
  if(!rows.length){list.innerHTML='<div class="empty">'+(tab==='cui'?'今日冇车要催':tab==='ok'?'本月仲未有已收记录':'揾唔到相符嘅车')+'</div>';return;}
  const showActs=tab!=='all';
  list.innerHTML=rows.map(({c,s})=>{
    const phone=(c.phone||'').trim();
    const amtHtml=c.rent?'<span class="yen">¥</span>'+c.rent.toLocaleString():'—';
    const who='租户 '+(c.tenant||'—')+'　交租日 '+(c.due_day||'—')+'号'+(c.note?'　'+c.note:'');
    let acts='';
    if(showActs){
      const call=phone?'<a class="b call" href="tel:'+phone+'">致电</a>':'<span class="b call off">无电话</span>';
      const main=s.key==='ok'?'<button class="b undo" onclick="undo('+c.id+')">撤销</button>':'<button class="b paid" onclick="markPaid('+c.id+')">已收</button>';
      acts='<div class="acts">'+call+'<button class="b edit" onclick="openForm('+c.id+')">改</button>'+main+'</div>';
    }
    const rc=showActs?'':' onclick="openForm('+c.id+')" style="cursor:pointer"';
    return '<div class="item"'+rc+'><div class="ihead"><div><div class="plate">'+(c.plate||'—')+'</div><div class="who">'+who+'</div></div>'
      +'<div class="right"><div class="amt">'+amtHtml+'</div><span class="pill '+s.cls+'">'+s.label+'</span></div></div>'+acts+'</div>';
  }).join('');
}
async function importSeed(btn){
  if(btn){btn.textContent='导入中…';btn.style.pointerEvents='none';}
  try{
    const seed=SEED.map((c,i)=>({id:i+1,last_paid:null,...c}));
    await saveCars(seed);
    await load();
  }catch(e){alert('导入失败：'+e);if(btn){btn.textContent='导入 138 部车';btn.style.pointerEvents='auto';}}
}
async function markPaid(id){try{await updateCars(cars=>{const c=cars.find(x=>x.id===id);if(c)c.last_paid=iso(today);});}catch(e){alert('保存失败：'+e);}}
async function undo(id){try{await updateCars(cars=>{const c=cars.find(x=>x.id===id);if(c)c.last_paid=null;});}catch(e){alert('失败：'+e);}}
function openForm(id){
  editing=id||null;const t=document.getElementById('formTitle'),del=document.getElementById('delBtn');const g=k=>document.getElementById('f_'+k);
  if(editing){const c=CARS.find(x=>x.id===editing);t.textContent='改资料';del.style.display='block';
    g('plate').value=c.plate||'';g('tenant').value=c.tenant||'';g('phone').value=c.phone||'';g('rent').value=c.rent||'';g('day').value=c.due_day||'';g('note').value=c.note||'';}
  else{t.textContent='加车';del.style.display='none';['plate','tenant','phone','rent','day','note'].forEach(k=>g(k).value='');}
  document.getElementById('mask').classList.add('on');
}
function closeForm(){document.getElementById('mask').classList.remove('on');}
async function submitForm(){
  const g=k=>document.getElementById('f_'+k).value.trim();
  const body={plate:g('plate')||null,tenant:g('tenant')||null,phone:g('phone')||null,rent:g('rent')?parseInt(g('rent')):null,due_day:g('day')?parseInt(g('day')):null,note:g('note')||null};
  try{
    await updateCars(cars=>{
      if(editing){const i=cars.findIndex(x=>x.id===editing);if(i>=0)cars[i]={...cars[i],...body};}
      else{const id=cars.reduce((m,c)=>Math.max(m,c.id||0),0)+1;cars.push({id,last_paid:null,...body});}
    });
    closeForm();await load();
  }catch(e){alert('保存失败：'+e);}
}
async function removeCar(){if(!editing)return;if(!confirm('确定删除呢部车？'))return;try{await updateCars(cars=>{const i=cars.findIndex(x=>x.id===editing);if(i>=0)cars.splice(i,1);});closeForm();await load();}catch(e){alert('删除失败：'+e);}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeForm();});
window.addEventListener('focus',load);
load();
